[project]
name = "agentseek-wecom"
version = "0.1.0"
description = "Enterprise WeCom callback channel for AgentSeek"
readme = "README.md"
authors = [{ name = "Chojan Shang", email = "psiace@apache.org" }]
requires-python = ">=3.12,<3.14"
dependencies = [
    "bub==0.3.9",
    "fastapi>=0.115.12",
    "pydantic-settings>=2.0.0",
    "pycryptodome>=3.20.0",
    "uvicorn>=0.34.0",
    "websockets>=15.0.1,<16",
]

[project.entry-points."bub"]
wecom = "agentseek_wecom.plugin:main"

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.pdm.build]
package-dir = "src"
includes = ["src/agentseek_wecom"]
