[project]
name = "agentseek-work"
version = "0.1.0"
description = "Persistent enterprise work ledger and deterministic lifecycle primitives for AgentSeek"
readme = "README.md"
authors = [{ name = "Chojan Shang", email = "psiace@apache.org" }]
requires-python = ">=3.12,<3.14"
dependencies = [
    "bub==0.3.9",
    "sqlalchemy>=2.0",
]

[project.entry-points."bub"]
work = "agentseek_work.plugin:main"

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.pdm.build]
package-dir = "src"
includes = ["src/agentseek_work"]
