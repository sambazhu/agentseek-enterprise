[project]
name = "enterprise_wecom_digital_employee"
version = "0.1.0"
description = "Enterprise WeCom Digital Employee — Enterprise WeCom digital employee over AgentSeek and DeepAgents."
authors = [{ name = "Your Name" }]
requires-python = ">=3.12,<3.14"
dependencies = [
    "agentseek",
    "agentseek-contextseek",
    "agentseek-enterprise",
    "agentseek-langchain",
    "agentseek-schedule-sqlalchemy",
    "agentseek-wecom",
    "bub-mcp",
    "contextseek[seekdb]",
    "deepagents>=0.5.3",
    "fastmcp>=2.0",
    "jaydebeapi>=1.2.3",
    "JPype1>=1.5",
    "langchain>=1.0",
    "langchain-openai>=0.3.0",
    "pydantic-settings>=2.0.0",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]

agentseek = { path = "../..", editable = true }
agentseek-contextseek = { path = "../../contrib/agentseek-contextseek", editable = true }
agentseek-enterprise = { path = "../../contrib/agentseek-enterprise", editable = true }
agentseek-langchain = { path = "../../contrib/agentseek-langchain", editable = true }
agentseek-schedule-sqlalchemy = { path = "../../contrib/agentseek-schedule-sqlalchemy", editable = true }
agentseek-wecom = { path = "../../contrib/agentseek-wecom", editable = true }

bub-mcp = { git = "https://github.com/bubbuild/bub-contrib.git", rev = "d9f177145b45d67cc0ca4703a495f062df8e3c32", subdirectory = "packages/bub-mcp" }
