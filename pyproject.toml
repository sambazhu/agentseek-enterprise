[project]
name = "agentseek"
version = "0.1.1"
description = "A database-native Agent Harness for runtime data workflows, powered by Bub"
authors = [{ name = "Chojan Shang", email = "psiace@apache.org" }]
readme = "README.md"
keywords = ['python']
requires-python = ">=3.12,<3.14"
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "bub==0.3.9",
    "cookiecutter>=2.5",
    "duty>=1.9",
    "filelock>=3.20.3",
    "jinja2>=3.1",
    "logfire>=4.33.0",
    "httpx>=0.28",
    "pydantic>=2.0",
    "pydantic-settings>=2.0.0",
    "typer>=0.12",
]

[project.scripts]
agentseek = "agentseek.__main__:app"

[project.urls]
Repository = "https://github.com/ob-labs/agentseek"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pre-commit>=4.5.1",
    "tox-uv>=1.29.0",
    "ty>=0.0.14",
    "ruff>=0.14.14",
    "mkdocs>=1.6.1",
    "mkdocstrings[python]>=1.0.2",
    "deepagents==0.6.12",
    "langchain-openai>=0.3.0",
    "langchain-mcp-adapters>=0.3,<0.4",
    "mcp>=1.28,<2",
    "mkdocs-terminal>=4.8.0",
    "mkdocs-static-i18n>=1.3.0",
]
plugins = [
    "bub-feishu",
    "bub-mcp",
    "bub-tapestore-otel",
    "agentseek-schedule-sqlalchemy",
    "agentseek-ag-ui",
    "agentseek-langchain",
    "agentseek-tapestore-oceanbase",
    "agentseek-contextseek",
    "agentseek-enterprise",
    "agentseek-files",
    "agentseek-wecom",
    "agentseek-work",
]

[build-system]
requires = ["pdm-backend", "pdm-build-skills>=0.1.0a3"]
build-backend = "pdm.backend"

[tool.pdm.build]
source-includes = [
    "README.md",
    "README.zh.md",
    "diagram/agentseek-readme",
]
includes = [
    "src/agentseek",
    "src/agentseek/data/*.json",
    "src/skills",
]
skills = [
    { git = "https://github.com/PsiACE/skills.git", ref = "4f09937234d128656fdc8c8658c840ebbf7e28d1", subpath = "skills", include = ["friendly-python", "piglet"] },
]

# Lock file is always resolved against PyPI. For faster install during dev, use:
#   UV_INDEX_URL=https://pypi.tuna.tsinghua.edu.cn/simple uv sync
[tool.uv]
index-url = "https://pypi.org/simple"
override-dependencies = [
    "bub @ git+https://github.com/bubbuild/bub.git@e5d8ceb3b30105e0d50e872be7d6ae6fb4066236",
]

[tool.uv.sources]
# bub-contrib: pin to a specific commit so resolves are reproducible across environments.
bub-feishu = { git = "https://github.com/bubbuild/bub-contrib.git", rev = "d9f177145b45d67cc0ca4703a495f062df8e3c32", subdirectory = "packages/bub-feishu" }
bub-mcp = { git = "https://github.com/bubbuild/bub-contrib.git", rev = "d9f177145b45d67cc0ca4703a495f062df8e3c32", subdirectory = "packages/bub-mcp" }
bub-tapestore-sqlalchemy = { git = "https://github.com/bubbuild/bub-contrib.git", rev = "d9f177145b45d67cc0ca4703a495f062df8e3c32", subdirectory = "packages/bub-tapestore-sqlalchemy" }
bub-tapestore-otel = { git = "https://github.com/bubbuild/bub-contrib.git", rev = "d9f177145b45d67cc0ca4703a495f062df8e3c32", subdirectory = "packages/bub-tapestore-otel" }
agentseek-tapestore-oceanbase = { workspace = true }
agentseek-langchain = { workspace = true }
agentseek-schedule-sqlalchemy = { workspace = true }
agentseek-ag-ui = { workspace = true }
agentseek-contextseek = { workspace = true }
agentseek-enterprise = { workspace = true }
agentseek-files = { workspace = true }
agentseek-wecom = { workspace = true }
agentseek-work = { workspace = true }

[tool.uv.workspace]
members = [
    "contrib/agentseek-ag-ui",
    "contrib/agentseek-enterprise",
    "contrib/agentseek-files",
    "contrib/agentseek-wecom",
    "contrib/agentseek-work",
    "contrib/agentseek-langchain",
    "contrib/agentseek-schedule-sqlalchemy",
    "contrib/agentseek-tapestore-oceanbase",
    "contrib/agentseek-contextseek",
    ".agentseek/agentseek-project",
]

[tool.ty.environment]
python = "./.venv"
python-version = "3.12"

[tool.ty.analysis]
# DeepAgents is a dev dependency used by contrib examples and tests.
allowed-unresolved-imports = ["deepagents.**"]

[tool.ty.src]
# references/ = third-party or example code.
# templates/ = cookiecutter sources containing jinja2 placeholders, not real Python.
exclude = [
    "references",
    "templates",
]

[tool.pytest.ini_options]
testpaths = [
    "tests",
]

[tool.ruff]
target-version = "py312"
line-length = 120
fix = true
extend-exclude = [
    "templates",
]

[tool.ruff.lint]
select = [
    # flake8-2020
    "YTT",
    # flake8-bandit
    "S",
    # flake8-bugbear
    "B",
    # flake8-builtins
    "A",
    # flake8-comprehensions
    "C4",
    # flake8-debugger
    "T10",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    # mccabe
    "C90",
    # pycodestyle
    "E", "W",
    # pyflakes
    "F",
    # pygrep-hooks
    "PGH",
    # pyupgrade
    "UP",
    # ruff
    "RUF",
    # tryceratops
    "TRY",
]
ignore = [
    # LineTooLong
    "E501",
    # DoNotAssignLambda
    "E731",
    # Ambiguous unicode: intentional CJK punctuation in a bilingual (zh) project.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"contrib/*/src/tests/*" = ["S101"]
"contrib/*/tests/*" = ["S101", "S106"]
"contrib/*/src/**/*.py" = ["TRY003"]
"src/skills/github-repo-cards/scripts/*.py" = ["S603", "S607"]
# Parameterized DM SQL: table names are static schema identifiers, values are bound separately.
"contrib/agentseek-enterprise/src/agentseek_enterprise/identity/dm_staff_provider.py" = ["S608"]
# Business-rule matching is intentionally branchy.
"contrib/agentseek-enterprise/src/agentseek_enterprise/identity/rules.py" = ["C901"]
# WeCom callback server defaults to all interfaces for deployment behind a reverse proxy.
"contrib/agentseek-wecom/src/agentseek_wecom/config.py" = ["S104"]
# WeCom signatures require SHA1 by the official protocol.
"contrib/agentseek-wecom/src/agentseek_wecom/crypto.py" = ["S324"]
# WeCom payload sanitizer is intentionally branchy over msgtype shapes.
"contrib/agentseek-wecom/src/agentseek_wecom/channel.py" = ["C901"]
# WeCom API resolver intentionally calls configured HTTPS endpoints.
"contrib/agentseek-wecom/src/agentseek_wecom/userid_resolver.py" = ["S310", "TRY004"]
# Signed response_url sender validates the official HTTPS host and exact API path before opening it.
"contrib/agentseek-wecom/src/agentseek_wecom/response_url.py" = ["S310"]
# Generated example code keeps direct, user-facing validation errors simple.
"examples/enterprise_wecom_digital_employee/src/**/*.py" = ["TRY003", "TRY004"]
"examples/enterprise_wecom_digital_employee/tests/*.py" = ["S101", "TRY003"]
# Probe scripts intentionally call configured endpoints and exit with concise diagnostics.
"scripts/probe_staff_identity.py" = ["S310"]
"scripts/probe_wecom_callback.py" = ["S310", "TRY003"]
"scripts/probe_wecom_user.py" = ["S310", "TRY003"]

[tool.ruff.format]
preview = true
