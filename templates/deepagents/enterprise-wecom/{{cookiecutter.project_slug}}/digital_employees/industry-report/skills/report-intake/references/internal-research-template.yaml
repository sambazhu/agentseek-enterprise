schema_version: 1
template_id: neutral-industry-report-internal-research
template_version: 1.0.0
report_asset_ref: strategic-report-docx@1.0.0
sections:
  - section_id: executive-summary
    title: 执行摘要
    questions:
      - question_id: executive-summary.core-trends
        prompt: 证券行业当前核心趋势、主要变化和重大不确定性是什么？
        search_mode: hybrid
        top_k: 4
        minimum_fused_score: 0.02
        minimum_keyword_score: 0.08
        minimum_semantic_score: 0.70
  - section_id: industry-overview
    title: 行业发展概况
    questions:
      - question_id: industry-overview.digital-transformation
        prompt: 证券行业数字化转型的目标、重点任务和实施路径是什么？
        search_mode: hybrid
        top_k: 4
        minimum_fused_score: 0.02
        minimum_keyword_score: 0.08
        minimum_semantic_score: 0.70
  - section_id: operating-benchmark
    title: 证券公司经营差异
    questions:
      - question_id: operating-benchmark.roe-and-structure
        prompt: 证券公司的收入利润、ROE、资本效率和业务结构有哪些可比目标？
        search_mode: hybrid
        top_k: 4
        minimum_fused_score: 0.02
        minimum_keyword_score: 0.08
        minimum_semantic_score: 0.70
  - section_id: business-line-benchmark
    title: 五矿证券业务线对标
    questions:
      - question_id: business-line-benchmark.five-lines
        prompt: 财富、投行、自营权益、自营固收、资管五条业务线应如何对标分析？
        search_mode: hybrid
        top_k: 4
        minimum_fused_score: 0.02
        minimum_keyword_score: 0.08
        minimum_semantic_score: 0.70
  - section_id: action-recommendations
    title: 借鉴点与行动建议
    questions:
      - question_id: action-recommendations.priorities
        prompt: 战略行动建议的优先级、适用条件、依赖、风险和验证指标是什么？
        search_mode: hybrid
        top_k: 4
        minimum_fused_score: 0.02
        minimum_keyword_score: 0.08
        minimum_semantic_score: 0.70
